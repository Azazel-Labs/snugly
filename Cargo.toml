[package]
name = "snugly"
description = "Deterministic 2D atlas packing of rectangles and irregular shapes: MaxRects and skyline rectangle packing, outline-based shape packing with hole filling, padding, 90° rotations."
version = "0.2.0"
edition = "2024"
license = "MIT-0"
repository = "https://github.com/Azazel-Labs/snugly"
documentation = "https://docs.rs/snugly"
rust-version = "1.88"
readme = "README.md"
exclude = ["assets/", "xtask/", ".cargo/"]
keywords = ["packing", "atlas", "texture", "uv", "maxrects"]
categories = ["graphics", "game-development", "algorithms"]

[features]
default = ["parallel"]
# Run independent packers and positions on rayon's thread pool. Output is identical without it.
parallel = ["dep:rayon"]
# Serialize / Deserialize for PackOptions, HoleFill and Placement.
serde = ["dep:serde"]

[dependencies]
glam = "0.34"
serde = { version = "1", features = ["derive"], optional = true }
rayon = { version = "1.10", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[workspace]
# xtask: repository chores (`cargo xtask hero`), never published.
members = ["xtask"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
use_self = "warn"
# Atlas coordinates and sizes are small and bounded: the u32 / i32 / f32 conversions in the
# packers can't truncate or lose meaningful precision.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Geometry code: x, y, w, h and friends read better than long names.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Index loops over parallel outline arrays read clearer than zipped iterators.
needless_range_loop = "allow"
type_complexity = "allow"
